name: Release gate condition editor

on:
  workflow_dispatch:
    inputs:
      version:
        description: Next Marketplace and GitHub release version (for example 1.1.53)
        required: true
        type: string
      publish_marketplace:
        description: Publish to the Marketplace and create a GitHub Release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  package:
    uses: $/.github/workflows/build.yml
    permissions:
      contents: read
    with:
      extension_version: ${{ inputs.version }}

  attest-release-artifacts:
    if: ${{ inputs.publish_marketplace && github.ref == 'refs/heads/main' }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: read
      id-token: write
    outputs:
      vsix_attestation_url: ${{ steps.attest-vsix.outputs.attestation-url }}
      tester_bundle_attestation_url: ${{ steps.attest-tester-bundle.outputs.attestation-url }}

    steps:
      - name: Download Marketplace package
        uses: actions/download-artifact@v8.0.2
        with:
          name: gate-condition-editor-vsix
          path: ${{ runner.temp }}/marketplace-package

      - name: Download executable release artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: gate-condition-editor
          path: ${{ runner.temp }}/release-binaries

      - name: Bundle executable and symbols
        env:
          BUNDLE_PATH: ${{ runner.temp }}/ServerTaskExpressionTester.zip
          RELEASE_BINARY_DIRECTORY: ${{ runner.temp }}/release-binaries
        run: |
          set -euo pipefail
          python3 - "$RELEASE_BINARY_DIRECTORY" "$BUNDLE_PATH" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          source = Path(sys.argv[1])
          bundle = Path(sys.argv[2])
          members = ("ServerTaskExpressionTester.exe", "ServerTaskExpressionTester.pdb")
          for name in members:
              file = source / name
              if not file.is_file() or file.stat().st_size == 0:
                  raise SystemExit(f"Required release file is missing or empty: {file}")

          with zipfile.ZipFile(bundle, "w", compression=zipfile.ZIP_DEFLATED) as archive:
              for name in members:
                  archive.write(source / name, arcname=name)

          with zipfile.ZipFile(bundle) as archive:
              if archive.namelist() != list(members) or archive.testzip() is not None:
                  raise SystemExit("The tester bundle failed its contents or CRC check.")
          PY

      - name: Attest VSIX build provenance
        id: attest-vsix
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: ${{ runner.temp }}/marketplace-package/${{ needs.package.outputs.vsix_file_name }}

      - name: Attest tester bundle build provenance
        id: attest-tester-bundle
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: ${{ runner.temp }}/ServerTaskExpressionTester.zip

      - name: Upload attested tester bundle
        uses: actions/upload-artifact@v6.0.0
        with:
          name: gate-condition-editor-release-bundle
          path: ${{ runner.temp }}/ServerTaskExpressionTester.zip
          if-no-files-found: error
          retention-days: 1

  release:
    if: ${{ inputs.publish_marketplace && github.ref == 'refs/heads/main' }}
    needs: [package, attest-release-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: marketplace-production
    permissions:
      attestations: read
      contents: write
      id-token: write

    steps:
      - name: Download Marketplace package
        uses: actions/download-artifact@v8.0.2
        with:
          name: gate-condition-editor-vsix
          path: ${{ runner.temp }}/marketplace-package

      - name: Download attested tester bundle
        uses: actions/download-artifact@v8.0.2
        with:
          name: gate-condition-editor-release-bundle
          path: ${{ runner.temp }}/release-binaries

      - name: Verify release version and package
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          VSIX_FILE_NAME: ${{ needs.package.outputs.vsix_file_name }}
          TESTER_BUNDLE: ${{ runner.temp }}/release-binaries/ServerTaskExpressionTester.zip
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^1\.1\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release version must use the current 1.1.<patch> format." >&2
            exit 1
          fi
          latest="$(gh release view latest --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          if [[ ! "$latest" =~ ^1\.1\.(0|[1-9][0-9]*)$ ]]; then
            echo "Latest GitHub release tag '$latest' is not in the expected 1.1.<patch> format." >&2
            exit 1
          fi
          release_patch="${RELEASE_VERSION##*.}"
          latest_patch="${latest##*.}"
          if (( release_patch < latest_patch )); then
            echo "Release version $RELEASE_VERSION is older than the latest GitHub release $latest." >&2
            exit 1
          fi
          package="$RUNNER_TEMP/marketplace-package/$VSIX_FILE_NAME"
          if [[ ! -s "$package" ]]; then
            echo "Expected Marketplace package was not found: $package" >&2
            exit 1
          fi
          if [[ ! -s "$TESTER_BUNDLE" ]]; then
            echo "The attested tester bundle was not found." >&2
            exit 1
          fi

      - name: Verify tester bundle build provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
          TESTER_BUNDLE: ${{ runner.temp }}/release-binaries/ServerTaskExpressionTester.zip
        run: |
          set -euo pipefail
          gh attestation verify "$TESTER_BUNDLE" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"

      - name: Verify VSIX build provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
          VSIX_FILE: ${{ runner.temp }}/marketplace-package/${{ needs.package.outputs.vsix_file_name }}
        run: |
          set -euo pipefail
          gh attestation verify "$VSIX_FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"

      - name: Sign in with GitHub OIDC
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
          audience: api://AzureADTokenExchange

      - name: Query current Marketplace version
        id: marketplace-version
        uses: jessehouwing/azdo-marketplace/query-version@v6.4.1
        with:
          auth-type: oidc
          publisher-id: jessehouwing
          extension-id: gate-condition-editor
          version-source: |
            marketplace
            0.0.0
          marketplace-version-action: None

      - name: Decide whether to publish
        id: release-state
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          MARKETPLACE_VERSION: ${{ steps.marketplace-version.outputs.current-version }}
        run: |
          set -euo pipefail
          if [[ "$MARKETPLACE_VERSION" == '0.0.0' ]]; then
            marketplace_patch=0
          elif [[ "$MARKETPLACE_VERSION" =~ ^1\.1\.(0|[1-9][0-9]*)$ ]]; then
            marketplace_patch="${BASH_REMATCH[1]}"
          else
            echo "Marketplace version '$MARKETPLACE_VERSION' is not in the expected 1.1.<patch> format." >&2
            exit 1
          fi

          release_patch="${RELEASE_VERSION##*.}"
          if (( release_patch < marketplace_patch )); then
            echo "Release version $RELEASE_VERSION is older than the current Marketplace version $MARKETPLACE_VERSION." >&2
            exit 1
          fi

          if (( release_patch == marketplace_patch )); then
            echo "publish_required=false" >> "$GITHUB_OUTPUT"
            echo "Marketplace already has version $RELEASE_VERSION; skipping duplicate publication."
          else
            echo "publish_required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish extension to Visual Studio Marketplace
        if: ${{ steps.release-state.outputs.publish_required == 'true' }}
        id: publish
        uses: jessehouwing/azdo-marketplace/publish@v6.4.1
        with:
          auth-type: oidc
          publisher-id: jessehouwing
          extension-id: gate-condition-editor
          use: vsix
          vsix-file: ${{ runner.temp }}/marketplace-package/${{ needs.package.outputs.vsix_file_name }}
          no-wait-validation: true

      - name: Verify published task preserved the attested VSIX
        if: ${{ steps.release-state.outputs.publish_required == 'true' }}
        env:
          ATTESTED_VSIX: ${{ runner.temp }}/marketplace-package/${{ needs.package.outputs.vsix_file_name }}
          PUBLISHED_VSIX: ${{ steps.publish.outputs.vsix-file }}
        run: |
          set -euo pipefail
          if [[ ! -s "$PUBLISHED_VSIX" ]]; then
            echo "The Marketplace publish action did not return its VSIX file." >&2
            exit 1
          fi
          if [[ "$(sha256sum "$ATTESTED_VSIX" | cut -d ' ' -f 1)" != "$(sha256sum "$PUBLISHED_VSIX" | cut -d ' ' -f 1)" ]]; then
            echo "The Marketplace publish action changed the attested VSIX." >&2
            exit 1
          fi

      - name: Download already-published VSIX for an idempotent retry
        if: ${{ steps.release-state.outputs.publish_required == 'false' }}
        id: download-published
        uses: jessehouwing/azdo-marketplace/download-vsix@v6.4.1
        with:
          auth-type: oidc
          publisher-id: jessehouwing
          extension-id: gate-condition-editor
          version: ${{ inputs.version }}
          output-path: ${{ runner.temp }}/published-marketplace-package

      - name: Verify existing Marketplace package matches this attestation
        if: ${{ steps.release-state.outputs.publish_required == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTED_VSIX: ${{ runner.temp }}/marketplace-package/${{ needs.package.outputs.vsix_file_name }}
          PUBLISHED_VSIX: ${{ steps.download-published.outputs.vsix-file }}
        run: |
          set -euo pipefail
          if [[ ! -s "$PUBLISHED_VSIX" ]]; then
            echo "The existing Marketplace version could not be downloaded." >&2
            exit 1
          fi
          if [[ "$(sha256sum "$ATTESTED_VSIX" | cut -d ' ' -f 1)" != "$(sha256sum "$PUBLISHED_VSIX" | cut -d ' ' -f 1)" ]]; then
            echo "The existing Marketplace VSIX differs from the attested package; refusing to publish a mismatched GitHub asset." >&2
            exit 1
          fi
          gh attestation verify "$PUBLISHED_VSIX" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"

      - name: Wait for Marketplace validation
        uses: jessehouwing/azdo-marketplace/wait-for-validation@v6.4.1
        with:
          auth-type: oidc
          publisher-id: jessehouwing
          extension-id: gate-condition-editor
          vsix-file: ${{ steps.publish.outputs.vsix-file || steps.download-published.outputs.vsix-file }}
          timeout-minutes: '30'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          VSIX_PATH: ${{ steps.download-published.outputs.vsix-file || format('{0}/marketplace-package/{1}', runner.temp, needs.package.outputs.vsix_file_name) }}
          TESTER_BUNDLE_PATH: ${{ runner.temp }}/release-binaries/ServerTaskExpressionTester.zip
          VSIX_ATTESTATION_URL: ${{ needs.attest-release-artifacts.outputs.vsix_attestation_url }}
          TESTER_BUNDLE_ATTESTATION_URL: ${{ needs.attest-release-artifacts.outputs.tester_bundle_attestation_url }}
        run: |
          set -euo pipefail
          if [[ -z "$VSIX_ATTESTATION_URL" || -z "$TESTER_BUNDLE_ATTESTATION_URL" ]]; then
            echo "A release artifact provenance attestation URL is missing." >&2
            exit 1
          fi
          releases="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft)"
          existing="$(jq -c --arg version "$RELEASE_VERSION" '[.[] | select(.tagName == $version)]' <<< "$releases")"
          existing_count="$(jq 'length' <<< "$existing")"

          if (( existing_count > 1 )); then
            echo "Multiple GitHub releases exist for $RELEASE_VERSION." >&2
            exit 1
          elif (( existing_count == 1 )); then
            is_draft="$(jq -r '.[0].isDraft' <<< "$existing")"
            if [[ "$is_draft" != 'true' ]]; then
              echo "GitHub release $RELEASE_VERSION already exists; skipping duplicate creation."
              exit 0
            fi
            gh release delete "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --yes
          fi

          notes="## Build provenance

          - VSIX attestation: $VSIX_ATTESTATION_URL
          - Tester bundle attestation: $TESTER_BUNDLE_ATTESTATION_URL"
          gh release create "$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_VERSION" \
            --generate-notes \
            --notes "$notes" \
            --target "$GITHUB_SHA" \
            "$VSIX_PATH" \
            "$TESTER_BUNDLE_PATH"
