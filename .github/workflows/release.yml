name: Release gate condition editor

on:
  workflow_dispatch:
    inputs:
      version:
        description: Next Marketplace and GitHub release version (for example 1.1.53)
        required: true
        type: string
      publish_marketplace:
        description: Publish to the Marketplace and create a GitHub Release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  package:
    uses: $/.github/workflows/build.yml
    permissions:
      contents: read
    with:
      extension_version: ${{ inputs.version }}

  attest-release-artifacts:
    if: ${{ inputs.publish_marketplace && github.ref == 'refs/heads/main' }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: read
      id-token: write
    outputs:
      vsix_attestation_url: ${{ steps.attest-vsix.outputs.attestation-url }}
      tester_bundle_attestation_url: ${{ steps.attest-tester-bundle.outputs.attestation-url }}

    steps:
      - name: Download Marketplace package
        uses: actions/download-artifact@v8.0.2
        with:
          name: gate-condition-editor-vsix
          path: ${{ runner.temp }}/marketplace-package

      - name: Download executable release artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: gate-condition-editor
          path: ${{ runner.temp }}/release-binaries

      - name: Bundle executable and symbols
        env:
          BUNDLE_PATH: ${{ runner.temp }}/ServerTaskExpressionTester.zip
          RELEASE_BINARY_DIRECTORY: ${{ runner.temp }}/release-binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $members = @('ServerTaskExpressionTester.exe', 'ServerTaskExpressionTester.pdb')
          foreach ($name in $members) {
            $file = Join-Path $env:RELEASE_BINARY_DIRECTORY $name
            if (-not (Test-Path -LiteralPath $file -PathType Leaf) -or (Get-Item -LiteralPath $file).Length -eq 0) {
              throw "Required release file is missing or empty: $file"
            }
          }

          $archive = [IO.Compression.ZipFile]::Open($env:BUNDLE_PATH, [IO.Compression.ZipArchiveMode]::Create)
          try {
            foreach ($name in $members) {
              $entry = $archive.CreateEntry($name, [IO.Compression.CompressionLevel]::Optimal)
              $sourceStream = [IO.File]::OpenRead((Join-Path $env:RELEASE_BINARY_DIRECTORY $name))
              try {
                $entryStream = $entry.Open()
                try {
                  $sourceStream.CopyTo($entryStream)
                }
                finally {
                  $entryStream.Dispose()
                }
              }
              finally {
                $sourceStream.Dispose()
              }
            }
          }
          finally {
            $archive.Dispose()
          }

          $verificationDirectory = Join-Path $env:RUNNER_TEMP "tester-bundle-verify-$([guid]::NewGuid().ToString('N'))"
          try {
            [IO.Compression.ZipFile]::ExtractToDirectory($env:BUNDLE_PATH, $verificationDirectory)
            $actualMembers = @(Get-ChildItem -LiteralPath $verificationDirectory -File -Recurse |
              ForEach-Object { [IO.Path]::GetRelativePath($verificationDirectory, $_.FullName).Replace('\', '/') } |
              Sort-Object -CaseSensitive)
            $expectedMembers = @($members | Sort-Object -CaseSensitive)
            if (Compare-Object -ReferenceObject $expectedMembers -DifferenceObject $actualMembers -CaseSensitive) {
              throw 'The tester bundle contains an unexpected file set.'
            }
            foreach ($name in $members) {
              $sourceHash = (Get-FileHash -LiteralPath (Join-Path $env:RELEASE_BINARY_DIRECTORY $name) -Algorithm SHA256).Hash
              $bundleHash = (Get-FileHash -LiteralPath (Join-Path $verificationDirectory $name) -Algorithm SHA256).Hash
              if ($sourceHash -cne $bundleHash) {
                throw "The tester bundle entry does not match the source file: $name"
              }
            }
          }
          finally {
            if (Test-Path -LiteralPath $verificationDirectory) {
              Remove-Item -LiteralPath $verificationDirectory -Recurse -Force
            }
          }

      - name: Attest VSIX build provenance
        id: attest-vsix
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: ${{ runner.temp }}/marketplace-package/${{ needs.package.outputs.vsix_file_name }}

      - name: Attest tester bundle build provenance
        id: attest-tester-bundle
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: ${{ runner.temp }}/ServerTaskExpressionTester.zip

      - name: Upload attested tester bundle
        uses: actions/upload-artifact@v6.0.0
        with:
          name: gate-condition-editor-release-bundle
          path: ${{ runner.temp }}/ServerTaskExpressionTester.zip
          if-no-files-found: error
          retention-days: 1

  release:
    if: ${{ inputs.publish_marketplace && github.ref == 'refs/heads/main' }}
    needs: [package, attest-release-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: marketplace-production
    permissions:
      attestations: read
      contents: write
      id-token: write

    steps:
      - name: Download Marketplace package
        uses: actions/download-artifact@v8.0.2
        with:
          name: gate-condition-editor-vsix
          path: ${{ runner.temp }}/marketplace-package

      - name: Download attested tester bundle
        uses: actions/download-artifact@v8.0.2
        with:
          name: gate-condition-editor-release-bundle
          path: ${{ runner.temp }}/release-binaries

      - name: Verify release version and package
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          VSIX_FILE_NAME: ${{ needs.package.outputs.vsix_file_name }}
          TESTER_BUNDLE: ${{ runner.temp }}/release-binaries/ServerTaskExpressionTester.zip
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_VERSION -notmatch '^1\.1\.(0|[1-9][0-9]*)$') {
            throw 'Release version must use the current 1.1.<patch> format.'
          }
          $releasePatch = [long]::Parse($Matches[1], [Globalization.CultureInfo]::InvariantCulture)
          $latestJson = gh release view latest --repo $env:GITHUB_REPOSITORY --json tagName
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not read the latest GitHub release.'
          }
          $latest = (($latestJson -join "`n") | ConvertFrom-Json).tagName
          if ($latest -notmatch '^1\.1\.(0|[1-9][0-9]*)$') {
            throw "Latest GitHub release tag '$latest' is not in the expected 1.1.<patch> format."
          }
          $latestPatch = [long]::Parse($Matches[1], [Globalization.CultureInfo]::InvariantCulture)
          if ($releasePatch -lt $latestPatch) {
            throw "Release version $env:RELEASE_VERSION is older than the latest GitHub release $latest."
          }
          $package = Join-Path (Join-Path $env:RUNNER_TEMP 'marketplace-package') $env:VSIX_FILE_NAME
          if (-not (Test-Path -LiteralPath $package -PathType Leaf) -or (Get-Item -LiteralPath $package).Length -eq 0) {
            throw "Expected Marketplace package was not found: $package"
          }
          if (-not (Test-Path -LiteralPath $env:TESTER_BUNDLE -PathType Leaf) -or (Get-Item -LiteralPath $env:TESTER_BUNDLE).Length -eq 0) {
            throw 'The attested tester bundle was not found.'
          }

      - name: Verify tester bundle build provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
          TESTER_BUNDLE: ${{ runner.temp }}/release-binaries/ServerTaskExpressionTester.zip
        shell: pwsh
        run: |
          gh attestation verify $env:TESTER_BUNDLE `
            --repo $env:GITHUB_REPOSITORY `
            --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/release.yml"
          if ($LASTEXITCODE -ne 0) {
            throw 'Tester bundle provenance verification failed.'
          }

      - name: Verify VSIX build provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
          VSIX_FILE: ${{ runner.temp }}/marketplace-package/${{ needs.package.outputs.vsix_file_name }}
        shell: pwsh
        run: |
          gh attestation verify $env:VSIX_FILE `
            --repo $env:GITHUB_REPOSITORY `
            --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/release.yml"
          if ($LASTEXITCODE -ne 0) {
            throw 'VSIX provenance verification failed.'
          }

      - name: Sign in with GitHub OIDC
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
          audience: api://AzureADTokenExchange

      - name: Query current Marketplace version
        id: marketplace-version
        uses: jessehouwing/azdo-marketplace/query-version@v6.4.1
        with:
          auth-type: oidc
          publisher-id: jessehouwing
          extension-id: gate-condition-editor
          version-source: |
            marketplace
            0.0.0
          marketplace-version-action: None

      - name: Decide whether to publish
        id: release-state
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          MARKETPLACE_VERSION: ${{ steps.marketplace-version.outputs.current-version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:MARKETPLACE_VERSION -eq '0.0.0') {
            $marketplacePatch = 0L
          }
          elseif ($env:MARKETPLACE_VERSION -match '^1\.1\.(0|[1-9][0-9]*)$') {
            $marketplacePatch = [long]::Parse($Matches[1], [Globalization.CultureInfo]::InvariantCulture)
          }
          else {
            throw "Marketplace version '$env:MARKETPLACE_VERSION' is not in the expected 1.1.<patch> format."
          }

          if ($env:RELEASE_VERSION -notmatch '^1\.1\.(0|[1-9][0-9]*)$') {
            throw 'Release version must use the current 1.1.<patch> format.'
          }
          $releasePatch = [long]::Parse($Matches[1], [Globalization.CultureInfo]::InvariantCulture)
          if ($releasePatch -lt $marketplacePatch) {
            throw "Release version $env:RELEASE_VERSION is older than the current Marketplace version $env:MARKETPLACE_VERSION."
          }

          if ($releasePatch -eq $marketplacePatch) {
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'publish_required=false' -Encoding utf8
            Write-Output "Marketplace already has version $env:RELEASE_VERSION; skipping duplicate publication."
          }
          else {
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'publish_required=true' -Encoding utf8
          }

      - name: Publish extension to Visual Studio Marketplace
        if: ${{ steps.release-state.outputs.publish_required == 'true' }}
        id: publish
        uses: jessehouwing/azdo-marketplace/publish@v6.4.1
        with:
          auth-type: oidc
          publisher-id: jessehouwing
          extension-id: gate-condition-editor
          use: vsix
          vsix-file: ${{ runner.temp }}/marketplace-package/${{ needs.package.outputs.vsix_file_name }}
          no-wait-validation: true

      - name: Verify published task preserved the attested VSIX
        if: ${{ steps.release-state.outputs.publish_required == 'true' }}
        env:
          ATTESTED_VSIX: ${{ runner.temp }}/marketplace-package/${{ needs.package.outputs.vsix_file_name }}
          PUBLISHED_VSIX: ${{ steps.publish.outputs.vsix-file }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath $env:PUBLISHED_VSIX -PathType Leaf) -or
              (Get-Item -LiteralPath $env:PUBLISHED_VSIX).Length -eq 0) {
            throw 'The Marketplace publish action did not return its VSIX file.'
          }
          $attestedHash = (Get-FileHash -LiteralPath $env:ATTESTED_VSIX -Algorithm SHA256).Hash
          $publishedHash = (Get-FileHash -LiteralPath $env:PUBLISHED_VSIX -Algorithm SHA256).Hash
          if ($attestedHash -cne $publishedHash) {
            throw 'The Marketplace publish action changed the attested VSIX.'
          }

      - name: Download already-published VSIX for an idempotent retry
        if: ${{ steps.release-state.outputs.publish_required == 'false' }}
        id: download-published
        uses: jessehouwing/azdo-marketplace/download-vsix@v6.4.1
        with:
          auth-type: oidc
          publisher-id: jessehouwing
          extension-id: gate-condition-editor
          version: ${{ inputs.version }}
          output-path: ${{ runner.temp }}/published-marketplace-package

      - name: Verify existing Marketplace package matches this attestation
        if: ${{ steps.release-state.outputs.publish_required == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTED_VSIX: ${{ runner.temp }}/marketplace-package/${{ needs.package.outputs.vsix_file_name }}
          PUBLISHED_VSIX: ${{ steps.download-published.outputs.vsix-file }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath $env:PUBLISHED_VSIX -PathType Leaf) -or
              (Get-Item -LiteralPath $env:PUBLISHED_VSIX).Length -eq 0) {
            throw 'The existing Marketplace version could not be downloaded.'
          }
          $attestedHash = (Get-FileHash -LiteralPath $env:ATTESTED_VSIX -Algorithm SHA256).Hash
          $publishedHash = (Get-FileHash -LiteralPath $env:PUBLISHED_VSIX -Algorithm SHA256).Hash
          if ($attestedHash -cne $publishedHash) {
            throw 'The existing Marketplace VSIX differs from the attested package; refusing to publish a mismatched GitHub asset.'
          }
          gh attestation verify $env:PUBLISHED_VSIX `
            --repo $env:GITHUB_REPOSITORY `
            --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/release.yml"
          if ($LASTEXITCODE -ne 0) {
            throw 'Published VSIX provenance verification failed.'
          }

      - name: Wait for Marketplace validation
        uses: jessehouwing/azdo-marketplace/wait-for-validation@v6.4.1
        with:
          auth-type: oidc
          publisher-id: jessehouwing
          extension-id: gate-condition-editor
          vsix-file: ${{ steps.publish.outputs.vsix-file || steps.download-published.outputs.vsix-file }}
          timeout-minutes: '30'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          VSIX_PATH: ${{ steps.download-published.outputs.vsix-file || format('{0}/marketplace-package/{1}', runner.temp, needs.package.outputs.vsix_file_name) }}
          TESTER_BUNDLE_PATH: ${{ runner.temp }}/release-binaries/ServerTaskExpressionTester.zip
          VSIX_ATTESTATION_URL: ${{ needs.attest-release-artifacts.outputs.vsix_attestation_url }}
          TESTER_BUNDLE_ATTESTATION_URL: ${{ needs.attest-release-artifacts.outputs.tester_bundle_attestation_url }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:VSIX_ATTESTATION_URL) -or
              [string]::IsNullOrWhiteSpace($env:TESTER_BUNDLE_ATTESTATION_URL)) {
            throw 'A release artifact provenance attestation URL is missing.'
          }

          $releaseList = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName,isDraft
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not list existing GitHub releases.'
          }
          $releases = @(($releaseList -join "`n") | ConvertFrom-Json)
          $existing = @($releases | Where-Object { $_.tagName -ceq $env:RELEASE_VERSION })
          if ($existing.Count -gt 1) {
            throw "Multiple GitHub releases exist for $env:RELEASE_VERSION."
          }
          if ($existing.Count -eq 1) {
            if (-not $existing[0].isDraft) {
              Write-Output "GitHub release $env:RELEASE_VERSION already exists; skipping duplicate creation."
              exit 0
            }
            gh release delete $env:RELEASE_VERSION --repo $env:GITHUB_REPOSITORY --yes
            if ($LASTEXITCODE -ne 0) {
              throw "Could not delete the existing draft release $env:RELEASE_VERSION."
            }
          }

          $notes = @(
            '## Build provenance'
            ''
            "- VSIX attestation: $env:VSIX_ATTESTATION_URL"
            "- Tester bundle attestation: $env:TESTER_BUNDLE_ATTESTATION_URL"
          ) -join "`n"
          $arguments = @(
            'release', 'create', $env:RELEASE_VERSION,
            '--repo', $env:GITHUB_REPOSITORY,
            '--title', $env:RELEASE_VERSION,
            '--generate-notes',
            '--notes', $notes,
            '--target', $env:GITHUB_SHA,
            $env:VSIX_PATH,
            $env:TESTER_BUNDLE_PATH
          )
          gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub Release creation failed.'
          }
