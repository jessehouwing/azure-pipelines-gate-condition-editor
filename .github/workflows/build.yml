name: Build gate condition editor

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      extension_version:
        description: Extension version to package
        required: false
        type: string
        default: '0.0.0'
    outputs:
      vsix_file_name:
        description: Name of the packaged Marketplace VSIX
        value: ${{ jobs.build.outputs.vsix_file_name }}

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build with Azure DevOps Server Express
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    outputs:
      vsix_file_name: ${{ steps.package.outputs.vsix-file-name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3.0.0
        with:
          vs-version: '[18.0,19.0)'

      - name: Restore verified Server DLL cache
        id: server-dll-cache
        # Public-repository caches are accessible to fork PRs.
        if: ${{ github.event.repository.private && vars.SERVER_DLL_CACHE_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ runner.temp }}\server-dll-cache
          key: azure-devops-server-dlls-20.0.37104.1-${{ runner.os }}-vs2026-5ed741f3a96c4677c431550fe345302e9d98831c0e405ea7735d5377e9c034fa

      - name: Install Azure DevOps Server Express (without configuration)
        if: ${{ steps.server-dll-cache.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $installer = Join-Path $env:RUNNER_TEMP 'azuredevopsexpress.exe'
          # Stable Express download linked by Microsoft's Server downloads page (LinkId=2330454).
          $url = 'https://download.visualstudio.microsoft.com/download/pr/1758aa41-92a1-437b-a953-34cbeaeadc90/beaac87770215af59bb2f7f23fc09564/azuredevopsexpress.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer
          $expectedHash = '5ED741F3A96C4677C431550FE345302E9D98831C0E405EA7735D5377E9C034FA'
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'Azure DevOps Server Express installer SHA-256 mismatch.'
          }
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(^|, )CN=Microsoft Corporation(,|$)') {
            throw 'The installer does not have a valid Microsoft Corporation signature.'
          }
          Write-Host "Verified Azure DevOps Server Express $((Get-Item $installer).VersionInfo.ProductVersion)"
          $log = Join-Path $env:RUNNER_TEMP 'azure-devops-server-install.log'
          # /Silent installs the binaries only. Do not run TfsConfig or the configuration wizard.
          $process = Start-Process -FilePath $installer -ArgumentList "/Silent /NoRestart /Log `"$log`"" -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Azure DevOps Server Express installation failed with exit code $($process.ExitCode). See $log."
          }
          if ($process.ExitCode -eq 3010) {
            Write-Warning 'The installer requested a restart; the build and smoke test must pass without restarting the runner.'
          }
          $installation = $null
          foreach ($key in @(
            'HKLM:\SOFTWARE\Microsoft\TeamFoundationServer\20.0',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\TeamFoundationServer\20.0'
          )) {
            if (Test-Path $key) {
              $installation = (Get-ItemPropertyValue $key -Name InstallPath).TrimEnd('\')
              break
            }
          }
          if (-not $installation) {
            throw 'The installer did not register an Azure DevOps Server 20.0 installation.'
          }
          foreach ($assembly in @(
            'Tools\Microsoft.TeamFoundation.DistributedTask.Orchestration.Server.dll',
            'Tools\Plugins\Microsoft.TeamFoundation.DistributedTask.Orchestration.Server.Extensions.dll',
            'Tools\Microsoft.TeamFoundation.DistributedTask.WebApi.dll',
            'Tools\Microsoft.TeamFoundation.Framework.Server.dll',
            'Tools\Newtonsoft.Json.dll'
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $installation $assembly) -PathType Leaf)) {
              throw "Required build reference was not installed: $assembly"
            }
          }
          "TfsInstallationDirectory=$installation" >> $env:GITHUB_ENV

      - name: Validate cached Server DLLs
        if: ${{ steps.server-dll-cache.outputs.cache-hit == 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cache = Join-Path $env:RUNNER_TEMP 'server-dll-cache'
          & tests\ServerDllCache.ps1 -Mode Validate -CacheDirectory $cache
          "TfsInstallationDirectory=$cache" >> $env:GITHUB_ENV

      - name: Build executable
        shell: pwsh
        run: >-
          msbuild ServerTaskExpressionTester.sln /restore /m
          /p:Configuration=Release "/p:Platform=Any CPU"
          "/p:TfsInstallationDirectory=$env:TfsInstallationDirectory"

      - name: Test expressions against installed server assemblies
        if: ${{ steps.server-dll-cache.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: >-
          powershell.exe -NoProfile -NonInteractive -STA
          -File tests\ServerSmokeTest.ps1
          -Executable ServerTaskExpressionTester\bin\Release\ServerTaskExpressionTester.exe

      - name: Test expressions against cached server assemblies
        if: ${{ steps.server-dll-cache.outputs.cache-hit == 'true' }}
        shell: pwsh
        run: >-
          powershell.exe -NoProfile -NonInteractive -STA
          -File tests\ServerSmokeTest.ps1
          -Executable ServerTaskExpressionTester\bin\Release\ServerTaskExpressionTester.exe
          -TfsInstallationDirectory "$env:TfsInstallationDirectory"

      - name: Stage verified Server DLLs for cache
        if: ${{ github.event.repository.private && vars.SERVER_DLL_CACHE_ENABLED == 'true' && steps.server-dll-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cache = Join-Path $env:RUNNER_TEMP 'server-dll-cache'
          & tests\ServerDllCache.ps1 -Mode Populate -CacheDirectory $cache -SourceDirectory $env:TfsInstallationDirectory

      - name: Save verified Server DLL cache
        if: ${{ github.event.repository.private && vars.SERVER_DLL_CACHE_ENABLED == 'true' && steps.server-dll-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ runner.temp }}\server-dll-cache
          key: azure-devops-server-dlls-20.0.37104.1-${{ runner.os }}-vs2026-5ed741f3a96c4677c431550fe345302e9d98831c0e405ea7735d5377e9c034fa

      - name: Package Marketplace extension
        id: package
        uses: jessehouwing/azdo-marketplace/package@v6.4.1
        with:
          publisher-id: jessehouwing
          extension-id: gate-condition-editor
          manifest-file: vss-extension.json
          extension-version: ${{ inputs.extension_version || '0.0.0' }}
          output-path: ${{ runner.temp }}

      - name: Verify Marketplace package contents
        shell: pwsh
        env:
          EXTENSION_VERSION: ${{ inputs.extension_version || '0.0.0' }}
          VSIX_FILE: ${{ steps.package.outputs.vsix-file }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EXTENSION_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw 'The extension version must use the numeric major.minor.patch format.'
          }
          if (-not (Test-Path -LiteralPath $env:VSIX_FILE -PathType Leaf)) {
            throw 'The Marketplace package task did not produce its VSIX output.'
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $package = [IO.Compression.ZipFile]::OpenRead($env:VSIX_FILE)
          try {
            $manifestEntry = $package.GetEntry('extension.vsixmanifest')
            if (-not $manifestEntry) {
              throw 'The VSIX package does not contain extension.vsixmanifest.'
            }
            $reader = [IO.StreamReader]::new($manifestEntry.Open())
            try {
              [xml]$manifest = $reader.ReadToEnd()
            }
            finally {
              $reader.Dispose()
            }
            $identity = $manifest.SelectSingleNode("//*[local-name()='Identity']")
            if (-not $identity -or
                $identity.GetAttribute('Publisher') -ne 'jessehouwing' -or
                $identity.GetAttribute('Id') -ne 'gate-condition-editor' -or
                $identity.GetAttribute('Version') -ne $env:EXTENSION_VERSION) {
              throw 'The VSIX publisher, extension ID, or version does not match the requested package.'
            }
            if ($package.Entries.FullName -match '(?i)(^|/)(azuredevopsexpress\.exe|Microsoft\.TeamFoundation\..*\.dll)$') {
              throw 'The VSIX must not contain the Azure DevOps Server installer or server assemblies.'
            }
          }
          finally {
            $package.Dispose()
          }

      - name: Upload executable
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gate-condition-editor
          if-no-files-found: error
          path: |
            ServerTaskExpressionTester/bin/Release/ServerTaskExpressionTester.exe
            ServerTaskExpressionTester/bin/Release/ServerTaskExpressionTester.exe.config
            ServerTaskExpressionTester/bin/Release/ServerTaskExpressionTester.pdb

      - name: Upload Marketplace package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gate-condition-editor-vsix
          if-no-files-found: error
          path: ${{ steps.package.outputs.vsix-file }}
          retention-days: 7

      - name: Upload installer diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: installer-diagnostics
          if-no-files-found: warn
          path: ${{ runner.temp }}/azure-devops-server-install*.log
